      Form controls stay ≥16px (CSS) so iOS never auto-zooms on focus.
    -->

      id="trabage-viewport"
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />

      name="twitter:description"
      content="Plataforma de empleo y oportunidades para Guinea Ecuatorial. Desarrollada por ZARREL TECH (zarrel.org)."

    <meta name="apple-mobile-web-app-title" content="TrabaGE" />
    <meta name="application-name" content="TrabaGE" />
    <title>TrabaGE</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('trabage_theme') === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0F172A' : '#2563EB');

          const standalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches ||
            window.navigator.standalone === true;
          const coarseTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
          if (standalone || coarseTouch) {
            document.documentElement.dataset.appShell = '1';
          }

          const preventBrowserZoom = (event) => {
            event.preventDefault();
          };

          window.addEventListener('gesturestart', preventBrowserZoom, { passive: false });
          window.addEventListener('gesturechange', preventBrowserZoom, { passive: false });
          window.addEventListener('gestureend', preventBrowserZoom, { passive: false });
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
