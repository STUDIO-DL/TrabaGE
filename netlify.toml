[build]
  command = "npm run build"
  publish = "dist"
  [build.environment]
    NODE_VERSION = "22"
    VITE_APP_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CV PDF (@react-pdf/renderer → yoga-layout WASM): 'wasm-unsafe-eval' allows
    # WebAssembly.instantiate without enabling JS eval()/new Function() ('unsafe-eval').
    # connect-src data: — Yoga embeds its WASM as a data: URI.
    # frame-src blob: — CV preview iframe uses URL.createObjectURL(pdfBlob).
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' data: https://*.supabase.co wss://*.supabase.co https://*.googleapis.com https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://fcm.googleapis.com https://sentry.io https://*.sentry.io https://*.ingest.sentry.io https://formspree.io https://*.formspree.io; worker-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'; form-action 'self' https://formspree.io https://*.formspree.io"

[[redirects]]
  from = "/*"
  to = "https://trabage.org/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.trabage.org"]}

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
